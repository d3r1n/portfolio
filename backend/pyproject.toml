[project]
name = "portfolio"
version = "0.1.0"
description = ""
authors = [{ name = "Derin Onder Eren", email = "derinondereren@gmail.com" }]
requires-python = ">=3.13"

dependencies = [
    "aiohttp[speedups]>=3.13.5,<4.0.0",
    "loguru>=0.7.3",
    "fastapi[standard]>=0.136.1",
    "sqlmodel>=0.0.39",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "pyjwt>=2.13.0",
    "pydantic-settings>=2.14.0",
    "bcrypt>=5.0.0",
    "redis>=8.0.1",
]

[dependency-groups]
dev = [
	"ruff>=0.11.2,<0.12.0"
]


[tool.ruff]
line-length = 120

[tool.basedpyright]
typeCheckingMode = "standard" # or "strict" if you want to be hardcore
pythonVersion = "3.13"        # Change to your target version

reportMissingImports = "error"
reportUnusedImport = "warning"
reportUndefinedVariable = "error"

reportUnknownMemberAccess = "none"    # Stops complaining when you do data.get("json") or library calls
reportUnknownArgumentType = "none"    # Stops complaining when passing external objects to functions
reportUnknownVariableType = "none"    # Stops complaining when a library returns an untyped variable
reportExplicitAny = "none"             # Allows you to explicitly use `Any` when necessary.

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["W191", "D206"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[build-system]
requires = ["uv-build>=0.7.19,<0.8.0"]
build-backend = "uv_build"
