<!doctype html>
<html lang="en" data-theme="wireframe">
	<head>
		<script>
			// Applied before first paint so SSR'd HTML doesn't flash the
			// default "wireframe" theme for visitors who last chose dark.
			// Mirrors the light/dark -> daisyUI theme mapping in theme-toggle.svelte.ts.
			try {
				document.documentElement.setAttribute(
					'data-theme',
					localStorage.getItem('theme') === 'dark' ? 'black' : 'wireframe'
				);
			} catch {}
		</script>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
