services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app:z
      - /app/node_modules # Do not let host modules overwrite container modules
      - /app/.svelte-kit # Keep internal build artifacts in the container
    depends_on:
      - backend
    networks:
      - portfolio-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./.env
    volumes:
      - ./backend:/app:z
      - /app/.venv
    networks:
      - portfolio-net
    depends_on:
      - database

  caddy:
    image: caddy:latest
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - portfolio-net

  database:
    image: postgres:16-alpine
    container_name: postgres_db
    # Pass the Postgres setup variables into the DB container
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - portfolio-net
    labels:
      - "ofelia.enabled=true"
      - "ofelia.job-exec.purge-sessions.schedule=@daily"
      - 'ofelia.job-exec.purge-sessions.command=psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c "DELETE FROM admin_sessions WHERE expires_at <= NOW() AT TIME ZONE ''UTC'';"'

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: portfolio_pgweb
    restart: always
    environment:
      # Tell pgweb how to connect internally to the Postgres service
      - PGWEB_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      - database

  # cron-cleanup:
  #   image: mcuadros/ofelia:latest
  #   # Crucial: Instruct Ofelia to run as a daemon searching for Docker labels
  #   command: daemon --docker
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   depends_on:
  #     - database
  #   networks:
  #     - portfolio-net
  #   restart: unless-stopped

networks:
  portfolio-net:
    driver: bridge

volumes:
  db_data:
  caddy_data:
  caddy_config:
