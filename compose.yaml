services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app:z
      - /app/node_modules # Do not let host modules overwrite container modules
      - /app/.svelte-kit # Keep internal build artifacts in the container
    depends_on:
      - backend
    networks:
      - portfolio-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./.env
    volumes:
      - ./backend:/app:z
      - /app/.venv
    networks:
      - portfolio-net
    depends_on:
      - database
      - redis

  redis:
    image: redis:7-alpine
    # Pure rate-limiter cache — losing it on restart just resets counters/blacklists, so no volume.
    networks:
      - portfolio-net

  caddy:
    image: caddy:latest
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      # Lets the Caddyfile tag its internal forward_auth call as a trusted caller.
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - portfolio-net

  database:
    image: postgres:16-alpine
    # Pass the Postgres setup variables into the DB container
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - portfolio-net

  pgweb:
    image: sosedoff/pgweb:latest
    restart: always
    environment:
      # Tell pgweb how to connect internally to the Postgres service
      - PGWEB_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      - database
    networks:
      - portfolio-net

  cron-cleanup:
    build:
      context: .
      dockerfile: Dockerfile.cron
      args:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_HOST: database
    depends_on:
      - database
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - portfolio-net
    restart: unless-stopped

networks:
  portfolio-net:
    driver: bridge

volumes:
  db_data:
  caddy_data:
  caddy_config:
